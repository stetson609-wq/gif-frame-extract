<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIF Frame Extractor</title>
<!-- Load gifuct-js UMD properly -->
<script src="https://cdn.jsdelivr.net/npm/gifuct-js@1.0.0/dist/gifuct.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
<style>
body { font-family:sans-serif; background:#121212; color:#eee; display:flex; flex-direction:column; align-items:center; padding:30px; }
h1 { color:#1abc9c; margin-bottom:20px; }
#dropzone { border:3px dashed #555; border-radius:15px; padding:60px 20px; width:90%; max-width:500px; text-align:center; cursor:pointer; transition:all 0.3s; color:#bbb; background:rgba(30,30,30,0.6); backdrop-filter:blur(10px); }
#dropzone.hover { border-color:#1abc9c; color:#1abc9c; background:rgba(30,30,30,0.8); transform:scale(1.03); }
#controls { display:flex; flex-wrap:wrap; gap:10px; margin-top:20px; }
button { padding:12px 25px; border:none; border-radius:8px; background:#1abc9c; color:#121212; cursor:pointer; transition:0.2s; }
button:hover { background:#16a085; transform:scale(1.05); }
#grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:15px; margin-top:20px; width:100%; max-width:900px; }
.grid-item { background:rgba(40,40,40,0.6); border-radius:10px; padding:10px; text-align:center; transition:0.3s; backdrop-filter:blur(6px); }
.grid-item:hover { transform:translateY(-5px) scale(1.05); box-shadow:0 12px 25px rgba(0,255,150,0.4); }
.grid-item img { max-width:100%; border-radius:5px; transition:0.3s; }
.grid-item img:hover { transform:scale(1.1) rotate(1deg); }
a { color:#1abc9c; text-decoration:none; display:block; margin-top:3px; font-size:0.9rem; }
a:hover { text-decoration:underline; }
</style>
</head>
<body>

<h1>GIF Frame Extractor</h1>
<div id="dropzone">Drag & Drop GIF Here or Click to Upload</div>
<input type="file" id="fileInput" accept="image/gif" style="display:none;">
<div id="controls">
  <button id="copy-btn" style="display:none;">Copy Base64 Links</button>
  <button id="zip-btn" style="display:none;">Download ZIP</button>
</div>
<div id="grid"></div>

<script>
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const grid = document.getElementById('grid');
const copyBtn = document.getElementById('copy-btn');
const zipBtn = document.getElementById('zip-btn');
let allLinks = [];
let allBlobs = [];

// Click to upload
dropzone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => {
  if(e.target.files[0]) handleFile(e.target.files[0]);
});

// Drag & drop
['dragenter','dragover'].forEach(eName => {
  dropzone.addEventListener(eName, e => { e.preventDefault(); dropzone.classList.add('hover'); });
});
['dragleave','drop'].forEach(eName => {
  dropzone.addEventListener(eName, e => { e.preventDefault(); dropzone.classList.remove('hover'); });
});
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if(file) handleFile(file);
});

// Main handler
async function handleFile(file){
  if(!file || file.type !== 'image/gif'){ alert("Please select a GIF file!"); return; }

  const buffer = await file.arrayBuffer();

  // Use window.GIFuct or GIFuctJS depending on CDN exposure
  const gifLibrary = window.GIFuct || window.gifuct;
  if(!gifLibrary){ alert("GIF library not loaded!"); return; }

  const gif = gifLibrary.parseGIF(buffer);
  const frames = gifLibrary.decompressFrames(gif,true);

  grid.innerHTML=''; allLinks=[]; allBlobs=[];

  for(let i=0;i<frames.length;i++){
    const frame = frames[i];
    const canvas = document.createElement('canvas');
    canvas.width = frame.dims.width;
    canvas.height = frame.dims.height;
    const ctx = canvas.getContext('2d');
    const imageData = ctx.createImageData(frame.dims.width, frame.dims.height);
    imageData.data.set(frame.patch);
    ctx.putImageData(imageData,0,0);

    const dataUrl = canvas.toDataURL('image/png');
    allLinks.push(dataUrl);

    const blob = await new Promise(res => canvas.toBlob(res,'image/png'));
    allBlobs.push({blob,name:`frame-${i+1}.png`});

    const item=document.createElement('div'); item.className='grid-item';
    const img=document.createElement('img'); img.src=dataUrl;
    const a=document.createElement('a'); a.href=dataUrl; a.download=`frame-${i+1}.png`; a.textContent=`Frame ${i+1}`;
    item.appendChild(img); item.appendChild(a); grid.appendChild(item);
  }

  copyBtn.style.display='inline-block';
  zipBtn.style.display='inline-block';
}

// Copy Base64
copyBtn.addEventListener('click',()=>{
  navigator.clipboard.writeText(allLinks.join('\n'));
  alert('Copied all Base64 links!');
});

// Download ZIP
zipBtn.addEventListener('click',async()=>{
  const zip=new JSZip();
  allBlobs.forEach(f=>zip.file(f.name,f.blob));
  const content=await zip.generateAsync({type:"blob"});
  saveAs(content,"frames.zip");
});
</script>

</body>
</html>
