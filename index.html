<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIF Frame Extractor</title>
<script type="module">
  import { parseGIF, decompressFrames } from 'https://cdn.jsdelivr.net/npm/gifuct-js@1.0.0/dist/gifuct.esm.min.js';
  import JSZip from 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.esm.min.js';
  import { saveAs } from 'https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.esm.min.js';

  window.GIFModule = { parseGIF, decompressFrames, JSZip, saveAs };
</script>

<style>
body { font-family:sans-serif; background:#121212; color:#eee; display:flex; flex-direction:column; align-items:center; padding:30px; min-height:100vh; }
h1 { color:#1abc9c; margin-bottom:20px; font-size:2.2rem; text-align:center; }
#dropzone { border:3px dashed #555; border-radius:20px; padding:60px 20px; width:90%; max-width:550px; text-align:center; cursor:pointer; color:#bbb; background:rgba(30,30,30,0.6); backdrop-filter:blur(10px); transition:all 0.3s ease; }
#dropzone.hover { border-color:#1abc9c; color:#1abc9c; background:rgba(30,30,30,0.85); transform:scale(1.03); box-shadow:0 12px 30px rgba(0,255,150,0.3); }
#controls { display:flex; flex-wrap:wrap; gap:12px; margin-top:20px; justify-content:center; }
button { padding:14px 28px; border:none; border-radius:12px; background:#1abc9c; color:#0d0d0d; font-weight:bold; cursor:pointer; transition:all 0.25s ease; box-shadow:0 5px 15px rgba(0,255,150,0.2); }
button:hover { background:#16a085; transform:scale(1.08); box-shadow:0 8px 25px rgba(0,255,150,0.4); }
#grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:20px; margin-top:20px; width:100%; max-width:950px; }
.grid-item { background:rgba(40,40,40,0.6); border-radius:15px; padding:10px; text-align:center; transition:all 0.3s ease; backdrop-filter:blur(6px); box-shadow:0 8px 20px rgba(0,255,150,0.1); }
.grid-item:hover { transform:translateY(-7px) scale(1.05); box-shadow:0 12px 35px rgba(0,255,150,0.4); }
.grid-item img { max-width:100%; border-radius:8px; margin-bottom:5px; transition:transform 0.3s ease; }
.grid-item img:hover { transform:scale(1.1) rotate(1deg); }
a { color:#1abc9c; text-decoration:none; display:block; margin-top:3px; font-size:0.9rem; }
a:hover { text-decoration:underline; }
</style>
</head>
<body>

<h1>GIF Frame Extractor</h1>

<div id="dropzone">Drag & Drop GIF Here or Click to Upload</div>
<input type="file" id="fileInput" accept="image/gif" style="display:none;">

<div id="controls">
  <button id="copy-btn" style="display:none;">Copy All Base64 Links</button>
  <button id="zip-btn" style="display:none;">Download All Frames as ZIP</button>
</div>

<div id="grid"></div>

<script>
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const grid = document.getElementById('grid');
const copyBtn = document.getElementById('copy-btn');
const zipBtn = document.getElementById('zip-btn');

let allLinks = [];
let allBlobs = [];

// Click-to-upload
dropzone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => { if(e.target.files[0]) handleFile(e.target.files[0]); });

// Drag & drop events
['dragenter','dragover'].forEach(eName => dropzone.addEventListener(eName, e => { e.preventDefault(); dropzone.classList.add('hover'); }));
['dragleave','drop'].forEach(eName => dropzone.addEventListener(eName, e => { e.preventDefault(); dropzone.classList.remove('hover'); }));
dropzone.addEventListener('drop', e => { e.preventDefault(); if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });

async function handleFile(file){
  if(!file || file.type!=='image/gif'){ alert("Please select a GIF file!"); return; }
  const { parseGIF, decompressFrames, JSZip, saveAs } = window.GIFModule;

  const buffer = await file.arrayBuffer();
  const gif = parseGIF(buffer);
  const frames = decompressFrames(gif,true);

  grid.innerHTML=''; allLinks=[]; allBlobs=[];

  for(let i=0;i<frames.length;i++){
    const frame = frames[i];
    const canvas = document.createElement('canvas');
    canvas.width = frame.dims.width;
    canvas.height = frame.dims.height;
    const ctx = canvas.getContext('2d');
    const imageData = ctx.createImageData(frame.dims.width, frame.dims.height);
    imageData.data.set(frame.patch);
    ctx.putImageData(imageData,0,0);

    const dataUrl = canvas.toDataURL('image/png');
    allLinks.push(dataUrl);

    const blob = await new Promise(res=>canvas.toBlob(res,'image/png'));
    allBlobs.push({blob,name:`frame-${i+1}.png`});

    const item=document.createElement('div'); item.className='grid-item';
    const img=document.createElement('img'); img.src=dataUrl;
    const a=document.createElement('a'); a.href=dataUrl; a.download=`frame-${i+1}.png`; a.textContent=`Frame ${i+1}`;
    item.appendChild(img); item.appendChild(a); grid.appendChild(item);
  }

  copyBtn.style.display='inline-block';
  zipBtn.style.display='inline-block';
}

// Copy Base64
copyBtn.addEventListener('click', ()=>{
  navigator.clipboard.writeText(allLinks.join('\n'));
  alert('Copied all Base64 links!');
});

// Download ZIP
zipBtn.addEventListener('click', async ()=>{
  const zip = new JSZip();
  allBlobs.forEach(f=>zip.file(f.name,f.blob));
  const content = await zip.generateAsync({type:'blob'});
  saveAs(content,'frames.zip');
});
</script>

</body>
</html>
