<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIF Frame Extractor & Rebuilder</title>
</head>
<body>
<h2>Select a GIF to extract frames:</h2>
<input type="file" id="gifInput" accept="image/gif">
<br><br>
<button id="processBtn">Extract & Rebuild GIF</button>
<br><br>
<h3>Output:</h3>
<img id="outputGif" alt="Rebuilt GIF will appear here">

<!-- Libraries -->
<script src="https://cdn.jsdelivr.net/npm/gifuct-js@1.0.2/dist/gifuct-js.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gif.js.optimized/dist/gif.js"></script>

<script>
const input = document.getElementById('gifInput');
const btn = document.getElementById('processBtn');
const output = document.getElementById('outputGif');

btn.addEventListener('click', async () => {
    if (!input.files[0]) {
        alert('Please select a GIF file first!');
        return;
    }

    const file = input.files[0];
    const arrayBuffer = await file.arrayBuffer();

    // Parse GIF and extract frames
    const gif = gifuct.parseGIF(arrayBuffer);
    const frames = gifuct.decompressFrames(gif, true);

    // Create a new GIF
    const newGif = new GIF({
        workers: 2,
        quality: 10,
        workerScript: 'https://cdn.jsdelivr.net/npm/gif.js.optimized/dist/gif.worker.js'
    });

    frames.forEach(frame => {
        // Create canvas to hold each frame
        const canvas = document.createElement('canvas');
        canvas.width = frame.dims.width;
        canvas.height = frame.dims.height;
        const ctx = canvas.getContext('2d');

        // Create ImageData from frame
        const imgData = ctx.createImageData(frame.dims.width, frame.dims.height);
        imgData.data.set(frame.patch);
        ctx.putImageData(imgData, 0, 0);

        // Add frame to new GIF
        newGif.addFrame(canvas, { delay: frame.delay });
    });

    // Render new GIF
    newGif.on('finished', blob => {
        output.src = URL.createObjectURL(blob);
    });

    newGif.render();
});
</script>
</body>
</html>
